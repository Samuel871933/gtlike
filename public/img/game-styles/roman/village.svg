<svg xmlns="http://www.w3.org/2000/svg" width="966" height="580" viewBox="0 0 966 580">
  <!-- Fond de la vue du village (d'après la maquette « Imperium — refonte ») : enceinte, routes et abords. -->
  <defs>
    <radialGradient id="gr" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#4A4430"/>
      <stop offset="0.6" stop-color="#353022"/>
      <stop offset="1" stop-color="#1D1A12"/>
    </radialGradient>
    <radialGradient id="inner" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#6A5A40"/>
      <stop offset="1" stop-color="#4A3E2C"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
    <pattern id="tex" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#000" fill-opacity="0.12"/>
      <circle cx="4" cy="4" r="0.5" fill="#fff" fill-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="966" height="580" fill="url(#gr)"/>

  <!-- Forêt (camp de bois) -->
  <g fill="#26301B" fill-opacity="0.9">
    <circle cx="40" cy="60" r="34"/><circle cx="90" cy="40" r="26"/><circle cx="150" cy="70" r="22"/>
    <circle cx="30" cy="140" r="26"/><circle cx="70" cy="190" r="18"/>
  </g>
  <g fill="#324026" fill-opacity="0.7">
    <circle cx="60" cy="90" r="18"/><circle cx="120" cy="50" r="14"/><circle cx="20" cy="190" r="14"/>
  </g>
  <!-- Fosse d'argile -->
  <ellipse cx="100" cy="455" rx="80" ry="40" fill="#6E3A24" fill-opacity="0.55"/>
  <ellipse cx="100" cy="455" rx="50" ry="22" fill="#502818" fill-opacity="0.55"/>
  <!-- Champs (ferme) -->
  <g transform="rotate(-6 870 110)" fill-opacity="0.55">
    <rect x="790" y="30" width="170" height="20" fill="#7C6A34"/>
    <rect x="790" y="50" width="170" height="20" fill="#655629"/>
    <rect x="790" y="70" width="170" height="20" fill="#7C6A34"/>
    <rect x="790" y="90" width="170" height="20" fill="#655629"/>
    <rect x="790" y="110" width="170" height="20" fill="#7C6A34"/>
    <rect x="790" y="130" width="170" height="20" fill="#655629"/>
  </g>
  <!-- Montagne (mine de fer) -->
  <path d="M800 490 l40-60 30 30 25-40 45 70z" fill="#4B4C4E" fill-opacity="0.6"/>

  <!-- Routes extérieures -->
  <path d="M483 50 V0 M483 470 V580 M206 260 H150 L110 150 M150 260 L110 405 M760 260 H816 L856 150 M816 260 L856 405"
        stroke="#5C4E38" stroke-width="16" stroke-linecap="round" fill="none" stroke-opacity="0.9"/>

  <!-- Enceinte -->
  <rect x="210" y="50" width="546" height="420" rx="44" fill="url(#inner)"/>
  <path d="M483 50 V470 M210 260 H756" stroke="#7A6A4E" stroke-width="18" fill="none"/>
  <path d="M483 50 V470 M210 260 H756" stroke="#8E7C5C" stroke-width="1" stroke-dasharray="6 6" fill="none" stroke-opacity="0.6"/>
  <rect x="210" y="50" width="546" height="420" rx="44" fill="url(#tex)"/>
  <rect x="210" y="50" width="546" height="420" rx="44" fill="none" stroke="#2A2218" stroke-width="16"/>
  <rect x="210" y="50" width="546" height="420" rx="44" fill="none" stroke="#8C7550" stroke-width="10"/>
  <rect x="210" y="50" width="546" height="420" rx="44" fill="none" stroke="#5E4C32" stroke-width="10" stroke-dasharray="4 10"/>
  <!-- Portes et tours -->
  <g fill="#8C7550" stroke="#2A2218" stroke-width="3">
    <rect x="468" y="35" width="30" height="30" rx="3"/>
    <rect x="468" y="455" width="30" height="30" rx="3"/>
    <rect x="196" y="245" width="30" height="30" rx="3"/>
    <rect x="740" y="245" width="30" height="30" rx="3"/>
    <circle cx="230" cy="70" r="16"/><circle cx="736" cy="70" r="16"/>
    <circle cx="230" cy="450" r="16"/><circle cx="736" cy="450" r="16"/>
  </g>

  <rect width="966" height="580" fill="url(#vignette)"/>
</svg>
