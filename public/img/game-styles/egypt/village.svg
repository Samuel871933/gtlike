<svg xmlns="http://www.w3.org/2000/svg" width="966" height="580" viewBox="0 0 966 580">
  <!-- Aperçu du style Égypte antique (sélecteur de thème de la page Compte) : sable doré, Nil bordé de palmiers,
       pyramides, enceinte de brique crue ; même disposition que les autres styles (enceinte 210,50 → 756,470,
       routes en croix). Aplats, traits d'encre, ombres portées. -->
  <defs>
    <pattern id="sand" width="40" height="12" patternUnits="userSpaceOnUse">
      <rect width="40" height="12" fill="#E3C27A"/>
      <path d="M0 9Q10 6 20 9T40 9" stroke="#C9A35A" stroke-width="1.5" fill="none" opacity="0.7"/>
    </pattern>
    <pattern id="paving" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#D9C08A"/>
      <path d="M0 0.5H16M0.5 0V16" stroke="#000" stroke-opacity="0.14"/>
    </pattern>
    <pattern id="fields" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#8FA64A"/>
      <rect y="5" width="10" height="5" fill="#A9BD5C"/>
    </pattern>
    <pattern id="brick" width="16" height="8" patternUnits="userSpaceOnUse">
      <rect width="16" height="8" fill="#C79A5B"/>
      <path d="M0 0.5H16M0 4.5H16M4 0V4M12 4V8" stroke="#000" stroke-opacity="0.22"/>
    </pattern>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.72" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <!-- Désert -->
  <rect width="966" height="580" fill="url(#sand)"/>

  <!-- Le Nil et ses rives vertes, à gauche -->
  <path d="M0 440C60 380 90 300 70 220S110 60 150 0H0Z" fill="#7E9A3E"/>
  <path d="M0 470C40 400 60 320 40 230S70 70 100 0H40C20 70 -10 150 10 230S0 380 0 420Z" fill="#2E7FA6" stroke="#000" stroke-width="3"/>
  <path d="M20 380C35 330 30 280 25 240" stroke="#8FC6DE" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Palmiers le long du fleuve -->
  <g stroke="#000" stroke-width="2.5" stroke-linejoin="round">
    <g transform="translate(120 120)"><path d="M0 0V38" stroke="#6B4A22" stroke-width="5"/><path d="M0 0L-22 8L-6 -2L-18 -16L0 -3L10 -20L6 -2L24 -8L4 2Z" fill="#3F7A2E"/></g>
    <g transform="translate(150 250)"><path d="M0 0V38" stroke="#6B4A22" stroke-width="5"/><path d="M0 0L-22 8L-6 -2L-18 -16L0 -3L10 -20L6 -2L24 -8L4 2Z" fill="#3F7A2E"/></g>
    <g transform="translate(112 370)"><path d="M0 0V38" stroke="#6B4A22" stroke-width="5"/><path d="M0 0L-22 8L-6 -2L-18 -16L0 -3L10 -20L6 -2L24 -8L4 2Z" fill="#3F7A2E"/></g>
  </g>

  <!-- Champs irrigués -->
  <rect x="86" y="470" width="120" height="80" fill="url(#fields)" stroke="#000" stroke-width="3"/>
  <rect x="800" y="470" width="130" height="70" fill="url(#fields)" stroke="#000" stroke-width="3"/>

  <!-- Pyramides, en haut à droite -->
  <g stroke="#000" stroke-width="3" stroke-linejoin="round">
    <path d="M790 180L860 60L930 180Z" fill="#E8C774"/>
    <path d="M860 60L930 180H880Z" fill="#B8923F"/>
    <path d="M760 190L805 115L850 190Z" fill="#E8C774"/>
    <path d="M805 115L850 190H818Z" fill="#B8923F"/>
    <path d="M847 72L860 60L873 72Z" fill="#F5D65A" stroke-width="2"/>
  </g>

  <!-- Enceinte de brique crue et routes en croix -->
  <rect x="216" y="58" width="546" height="420" fill="#000" opacity="0.25"/>
  <rect x="210" y="50" width="546" height="420" fill="url(#brick)" stroke="#000" stroke-width="4"/>
  <rect x="232" y="72" width="502" height="376" fill="#EBD39A" stroke="#000" stroke-width="3"/>
  <rect x="466" y="72" width="34" height="376" fill="url(#paving)" stroke="#000" stroke-width="2"/>
  <rect x="232" y="244" width="502" height="34" fill="url(#paving)" stroke="#000" stroke-width="2"/>

  <!-- Portes (pylônes) : or et noir -->
  <g stroke="#000" stroke-width="3">
    <rect x="456" y="456" width="54" height="30" fill="#1D1A12"/>
    <rect x="462" y="462" width="42" height="6" fill="#E2B43A" stroke="none"/>
    <rect x="198" y="234" width="30" height="54" fill="#1D1A12"/>
    <rect x="740" y="234" width="30" height="54" fill="#1D1A12"/>
    <rect x="456" y="36" width="54" height="30" fill="#1D1A12"/>
  </g>

  <!-- Obélisques de part et d'autre de l'allée -->
  <g stroke="#000" stroke-width="2.5" stroke-linejoin="round">
    <path d="M438 330L444 300L450 330Z" fill="#F5D65A"/><rect x="438" y="330" width="12" height="60" fill="#E2B43A"/>
    <path d="M516 330L522 300L528 330Z" fill="#F5D65A"/><rect x="516" y="330" width="12" height="60" fill="#E2B43A"/>
  </g>

  <!-- Bassin sacré -->
  <rect x="300" y="120" width="120" height="80" fill="#2E7FA6" stroke="#000" stroke-width="3"/>
  <rect x="306" y="126" width="108" height="10" fill="#8FC6DE"/>

  <!-- Temple : colonnade, frise lapis et or -->
  <g stroke="#000" stroke-width="3">
    <rect x="560" y="110" width="140" height="96" fill="#E8D4A0"/>
    <rect x="560" y="110" width="140" height="16" fill="#1F4A7A"/>
    <rect x="566" y="115" width="128" height="5" fill="#E2B43A" stroke="none"/>
    <rect x="574" y="134" width="12" height="64" fill="#D9C08A"/>
    <rect x="600" y="134" width="12" height="64" fill="#D9C08A"/>
    <rect x="648" y="134" width="12" height="64" fill="#D9C08A"/>
    <rect x="674" y="134" width="12" height="64" fill="#D9C08A"/>
  </g>

  <!-- Place et sphinx couchés -->
  <circle cx="483" cy="261" r="40" fill="#D9C08A" stroke="#000" stroke-width="3"/>
  <g stroke="#000" stroke-width="2.5" stroke-linejoin="round" fill="#D6AE5E">
    <path d="M290 330h56v22h-56z"/><path d="M340 318h18v34h-18z"/>
    <path d="M620 330h56v22h-56z"/><path d="M608 318h18v34h-18z"/>
  </g>

  <rect width="966" height="580" fill="url(#vignette)"/>
</svg>
