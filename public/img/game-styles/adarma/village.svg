<svg xmlns="http://www.w3.org/2000/svg" width="966" height="580" viewBox="0 0 966 580">
  <!-- Fond de la vue du village, style Médiéval (couleurs de Guerre Tribale : herbe verte, chemins clairs ; même disposition que le style romain) : plan vu de dessus, aplats, traits d'encre, ombres portées.
       Enceinte 210,50 → 756,470 ; routes en croix ; les bâtiments sont posés par-dessus (partials/village-plan.ejs). -->
  <defs>
    <pattern id="ground" width="34" height="10" patternUnits="userSpaceOnUse">
      <rect width="34" height="10" fill="#6F8B3A"/>
      <rect width="34" height="2" fill="#000" fill-opacity="0.14"/>
      <rect width="1" height="10" fill="#000" fill-opacity="0.08"/>
    </pattern>
    <pattern id="paving" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#A08E6E"/>
      <path d="M0 0.5H16M0.5 0V16" stroke="#000" stroke-opacity="0.16"/>
    </pattern>
    <pattern id="fields" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#B39A4A"/>
      <rect y="5" width="10" height="5" fill="#CFB561"/>
    </pattern>
    <pattern id="arches" width="13" height="15" patternUnits="userSpaceOnUse">
      <rect width="13" height="15" fill="#B8AD98"/>
      <rect x="10" width="3" height="15" fill="#5A4A36"/>
    </pattern>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.72" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3A2206" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <rect width="966" height="580" fill="url(#ground)"/>

  <!-- Aqueduc -->
  <rect x="-1" y="19" width="470" height="15" fill="#000" fill-opacity="0.35" transform="translate(3 3)"/>
  <rect x="-4" y="16" width="470" height="15" fill="url(#arches)" stroke="#000" stroke-width="2"/>

  <!-- Forêt (camp de bois) -->
  <g stroke="#000" stroke-width="2">
    <circle cx="36" cy="72" r="26" fill="#3F5A22"/><circle cx="86" cy="58" r="22" fill="#4D6A2A"/>
    <circle cx="142" cy="86" r="20" fill="#3F5A22"/><circle cx="26" cy="150" r="22" fill="#4D6A2A"/>
    <circle cx="170" cy="150" r="16" fill="#3F5A22"/><circle cx="60" cy="198" r="16" fill="#3F5A22"/>
  </g>
  <g fill="#5D7A30"><circle cx="30" cy="66" r="10"/><circle cx="82" cy="52" r="8"/><circle cx="138" cy="80" r="7"/><circle cx="20" cy="144" r="8"/></g>

  <!-- Fosse d'argile -->
  <ellipse cx="104" cy="424" rx="84" ry="44" fill="#9A5A34" stroke="#000" stroke-width="3"/>
  <ellipse cx="104" cy="428" rx="54" ry="24" fill="#74401F"/>

  <!-- Champs (ferme) -->
  <rect x="806" y="60" width="150" height="170" fill="url(#fields)" stroke="#000" stroke-width="3"/>
  <path d="M806 145H956M881 60V230" stroke="#000" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Colline et mine de fer -->
  <path d="M800 480l44-78 30 34 28-52 54 96z" fill="#8A867C" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
  <path d="M862 480l-6-26h28l-6 26z" fill="#5A4A36"/>

  <!-- Routes extérieures -->
  <g fill="#9A8260" stroke="#000" stroke-width="2">
    <rect x="-4" y="250" width="218" height="20"/>
    <rect x="752" y="250" width="218" height="20"/>
    <rect x="473" y="466" width="20" height="118"/>
  </g>

  <!-- Enceinte : ombre portée, rempart, dallage intérieur, routes en croix -->
  <rect x="222" y="62" width="546" height="420" fill="#000" fill-opacity="0.55"/>
  <rect x="210" y="50" width="546" height="420" fill="#9C917C" stroke="#000" stroke-width="3"/>
  <rect x="222" y="62" width="522" height="396" fill="url(#paving)" stroke="#000" stroke-width="3"/>
  <g fill="#9A8260" stroke="#000" stroke-width="2">
    <rect x="473" y="62" width="20" height="396"/>
    <rect x="222" y="250" width="522" height="20"/>
  </g>

  <!-- Tours et portes -->
  <g stroke="#000" stroke-width="3">
    <g fill="#AA9F8A">
      <rect x="194" y="34" width="32" height="32"/><rect x="740" y="34" width="32" height="32"/>
      <rect x="194" y="454" width="32" height="32"/><rect x="740" y="454" width="32" height="32"/>
      <rect x="467" y="34" width="32" height="32"/>
      <rect x="198" y="145" width="24" height="24"/><rect x="744" y="145" width="24" height="24"/>
      <rect x="198" y="351" width="24" height="24"/><rect x="744" y="351" width="24" height="24"/>
      <rect x="333" y="458" width="24" height="24"/><rect x="609" y="458" width="24" height="24"/>
    </g>
    <g fill="#7A1212">
      <rect x="463" y="450" width="40" height="40"/>
      <rect x="190" y="240" width="40" height="40"/><rect x="736" y="240" width="40" height="40"/>
    </g>
  </g>

  <rect width="966" height="580" fill="url(#vignette)"/>
</svg>
