<!doctype html><meta charset="utf-8"><style>iframe{width:1440px;height:1600px}pre{background:white;color:black}</style><pre id="result">RUNNING</pre><iframe src="../../zeppelin.html"></iframe><script>
document.querySelector('iframe').onload=async()=>{const out=document.getElementById('result');try{const d=document.querySelector('iframe').contentDocument,$=id=>d.getElementById(id),state=$('map-view');const check=(v,m)=>{if(!v)throw Error(m)};const wait=ms=>new Promise(r=>setTimeout(r,ms));const until=async fn=>{const end=Date.now()+18000;while(!fn()){if(Date.now()>end)throw Error('timeout '+$('map-status').textContent);await wait(100)}};const num=id=>Number($(id).textContent.replace(/\D/g,''));const pick=id=>d.querySelector(`[data-district="${id}"]`).click();const fly=async id=>{pick(id);check(!$('map-travel').disabled,'trajet disponible '+id);$('map-travel').click();check(state.dataset.phase==='travel','voyage lancé');check(($('route-live').getAttribute('d').match(/L/g)||[]).length>=2,'trajet via les couloirs');check($('map-travel').disabled,'double ordre bloqué');await until(()=>state.dataset.phase==='idle');check(state.dataset.current===id,'arrivée '+id)};const trade=(dir,r,n)=>{$('trade-quantity').value=n;d.querySelector(`[data-trade="${dir}"][data-resource="${r}"]`).click()};
 $('map-tab').click();check(d.querySelectorAll('.city-background').length===1,'fond de cité unique');check(d.querySelectorAll('.district').length===6,'six ports');check(d.querySelectorAll('.city-connections line').length===11,'réseau aérien');check(d.querySelectorAll('.other-airship').length===4,'capitaines');await wait(300);check([...d.querySelectorAll('.city-background')].every(i=>i.naturalWidth>0),'assets chargés');
 pick('port');$('seal-cargo').click();check(state.dataset.seals==='2','scellés');check(state.dataset.credits==='1740','coût scellés');$('guarded-route').checked=false;$('guarded-route').dispatchEvent(new Event('change'));$('arm-raid').click();const before=num('alloy');await fly('marche');check(num('alloy')===before,'scellés empêchent vol');check(state.dataset.seals==='1','scellé consommé');
 trade('sell',0,100);check(num('alloy')===8350,'vente déduite');check(state.dataset.credits==='2340','crédits vente');trade('buy',1,100);check(num('water')===6380,'achat ajouté');check(state.dataset.credits==='1440','crédits achat');trade('buy',2,1000);check(state.dataset.credits==='1440','achat insuffisant bloqué');trade('sell',0,0);check(num('alloy')===8350,'quantité nulle bloquée');
 await fly('cuivre');check(state.dataset.seals==='0','deuxième scellé consommé');$('district-collect').click();await until(()=>state.dataset.phase==='idle');check(num('alloy')===8590,'collecte 240');$('arm-raid').click();d.querySelector('[data-service="forge-marche"]').click();check($('map-travel').disabled,'services au même port');check(d.querySelector('[data-trade="sell"]')!==null,'marché regroupé');await fly('marche');check(num('alloy')===8470,'vol simulé 120');check(state.dataset.hull==='90','coque endommagée');check(d.querySelector('[data-trade="sell"]')!==null,'autre marché');
 await fly('atelier');$('repair-hull').click();check(state.dataset.hull==='100','réparation');check(state.dataset.credits==='1400','coût réparation');$('guarded-route').checked=true;$('guarded-route').dispatchEvent(new Event('change'));$('arm-raid').click();const guarded=num('alloy');await fly('marche');check(num('alloy')===guarded,'surveillance empêche vol');check(state.dataset.hull==='100','coque protégée');check(d.querySelectorAll('.berth-row').length===2,'port du quartier');
 $('deck-tab').click();check(!$('deck-view').hidden,'pont préservé');out.textContent='PASS : 1 cité / 6 ports, fond illustré et voies aériennes, ports, voyages, scellés, achat, vente, limites, collecte, vol simulé, réparation et surveillance';
 }catch(e){out.textContent='FAIL : '+e.message}};
</script>
